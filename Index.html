<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Organizador de Texto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            min-height: 50px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h2>Organizador de Texto</h2>

    <textarea id="entrada" placeholder="Cole várias linhas aqui..."></textarea>

    <button onclick="organizar()">Arrumar Texto</button>

    <h3>Resultado:</h3>
    <div id="resultado"></div>

    <script>
        function organizar() {
            const texto = document.getElementById('entrada').value;

            const resultado = texto
                .split('\n')
                .map(linha => linha.trim())
                .filter(linha => linha !== '')
                .join(', ');

            document.getElementById('resultado').textContent = resultado;
        }
    </script>

</body>
</html>
