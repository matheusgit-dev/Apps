<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter para Caixa Alta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Converter Texto para Caixa Alta</h2>

    <textarea id="texto" placeholder="Cole ou digite seu texto aqui"></textarea>
    <br>
    <button onclick="converter()">Converter para MAIÚSCULAS</button>

    <script>
        function converter() {
            const campo = document.getElementById("texto");
            campo.value = campo.value.toUpperCase();
        }
    </script>

</body>
</html>
